<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<header></header>
<body >
<main class="container" th:fragment="layout">
    <form action="/new-user" method="POST">
        <div class="form-group row">
            <label for="inputText3" class="col-sm-2 col-form-label">Логин</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="inputText3"  name="username" placeholder="Логин">
            </div>
        </div>
        <div class="form-group row">
            <label for="inputPassword3" class="col-sm-2 col-form-label">Пароль</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="inputPassword3"  name = "password" placeholder="Пароль">
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-10">
                <button type="submit" class="btn btn-primary">Отправить</button>
            </div>
        </div>
    </form>
</main>
</body>
</html>
